<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" class="ira-svg" data-character="dr-ira-v1">
  <!-- Dr. Ira v1: the ONE character rig used in every Pulse Health Reel. Do not redraw per scene. -->
  <!-- Mouth shapes (.m-X rest, A closed m/b/p, B slight, C open, D wide, E round o, F f/v) are switched by data-mouth on the wrapper. -->
  <style>.ira-mouth .m{display:none}.ira-mouth .m-X{display:inline}</style>
  <g class="ira-body">
    <!-- neck -->
    <rect x="348" y="560" width="104" height="170" rx="40" fill="#B97A57"/>
    <ellipse cx="400" cy="610" rx="56" ry="20" fill="#9C6244" opacity="0.55"/>
    <!-- scrubs torso with V-neck notch -->
    <path d="M 80 1100 L 80 1000 C 92 772 214 702 330 684 L 400 806 L 470 684 C 586 702 708 772 720 1000 L 720 1100 Z" fill="#0F7C7E"/>
    <path d="M 330 684 L 400 806 L 470 684" fill="none" stroke="#0B5F61" stroke-width="10" stroke-linejoin="round"/>
    <!-- white undershirt collar band -->
    <path d="M 336 684 L 400 790 L 464 684 L 448 682 L 400 760 L 352 682 Z" fill="#FFFFFF"/>
    <!-- chest pocket + pen -->
    <rect x="492" y="838" width="96" height="78" rx="8" fill="none" stroke="#0B5F61" stroke-width="7"/>
    <rect x="512" y="808" width="12" height="44" rx="5" fill="#E8914A"/>
    <!-- stethoscope -->
    <path d="M 318 692 C 296 770 298 850 330 900" fill="none" stroke="#3D4448" stroke-width="13" stroke-linecap="round"/>
    <path d="M 482 692 C 508 760 512 820 488 870" fill="none" stroke="#3D4448" stroke-width="13" stroke-linecap="round"/>
    <circle cx="488" cy="876" r="11" fill="#C9D1D5"/>
    <circle cx="331" cy="926" r="30" fill="#C9D1D5" stroke="#8A949A" stroke-width="7"/>
    <circle cx="331" cy="926" r="12" fill="#8A949A"/>
  </g>

  <g class="ira-head" transform="translate(0 132)">
    <!-- ears -->
    <ellipse cx="262" cy="342" rx="24" ry="40" fill="#B07150"/>
    <ellipse cx="538" cy="342" rx="24" ry="40" fill="#B07150"/>
    <!-- face -->
    <ellipse cx="400" cy="330" rx="140" ry="168" fill="#B97A57"/>
    <!-- short dark hair -->
    <path d="M 258 330 C 246 186 326 128 410 132 C 502 136 566 194 544 330 C 536 262 500 224 440 218 C 384 228 326 222 292 258 C 272 282 262 304 258 330 Z" fill="#2B1D16"/>
    <!-- eyebrows -->
    <path d="M 322 284 Q 350 268 380 280" fill="none" stroke="#2B1D16" stroke-width="10" stroke-linecap="round"/>
    <path d="M 420 280 Q 450 268 478 284" fill="none" stroke="#2B1D16" stroke-width="10" stroke-linecap="round"/>
    <!-- eyes (scaleY for blinks) -->
    <g class="ira-eyes">
      <ellipse cx="352" cy="326" rx="12" ry="15" fill="#1E1512"/>
      <ellipse cx="448" cy="326" rx="12" ry="15" fill="#1E1512"/>
      <circle cx="356" cy="320" r="4" fill="#FFFFFF"/>
      <circle cx="452" cy="320" r="4" fill="#FFFFFF"/>
    </g>
    <!-- nose -->
    <path d="M 401 344 Q 390 382 406 392" fill="none" stroke="#8E5A3C" stroke-width="6" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="322" cy="388" r="24" fill="#E07A5F" opacity="0.22"/>
    <circle cx="478" cy="388" r="24" fill="#E07A5F" opacity="0.22"/>
    <!-- mouth shapes -->
    <g class="ira-mouth">
      <path class="m m-X" d="M 364 426 Q 400 450 436 426" fill="none" stroke="#5A1F1F" stroke-width="7" stroke-linecap="round"/>
      <path class="m m-A" d="M 370 432 Q 400 438 430 432" fill="none" stroke="#5A1F1F" stroke-width="8" stroke-linecap="round"/>
      <path class="m m-B" d="M 368 427 Q 400 421 432 427 Q 400 446 368 427 Z" fill="#5A1F1F"/>
      <g class="m m-C">
        <path d="M 365 424 Q 400 416 435 424 Q 400 464 365 424 Z" fill="#5A1F1F"/>
        <path d="M 374 424 Q 400 419 426 424 L 424 431 Q 400 428 376 431 Z" fill="#FFFFFF"/>
      </g>
      <g class="m m-D">
        <path d="M 360 420 Q 400 410 440 420 Q 400 484 360 420 Z" fill="#5A1F1F"/>
        <path d="M 371 420 Q 400 414 429 420 L 427 428 Q 400 424 373 428 Z" fill="#FFFFFF"/>
        <ellipse cx="400" cy="456" rx="20" ry="9" fill="#C0504D"/>
      </g>
      <ellipse class="m m-E" cx="400" cy="436" rx="17" ry="22" fill="#5A1F1F"/>
      <g class="m m-F">
        <path d="M 368 428 Q 400 422 432 428 Q 400 444 368 428 Z" fill="#5A1F1F"/>
        <path d="M 372 428 Q 400 423 428 428 L 426 436 Q 400 433 374 436 Z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- raised right hand for gestures (hidden unless a scene shows it) -->
  <g class="ira-hand" opacity="0"><g transform="translate(-60 -200)">
    <path d="M 580 1100 L 636 770 L 742 770 L 786 1100 Z" fill="#0F7C7E"/>
    <rect x="630" y="642" width="112" height="128" rx="44" fill="#B97A57"/>
    <rect class="f f1" x="634" y="560" width="25" height="110" rx="12.5" fill="#B97A57"/>
    <rect class="f f2" x="662" y="540" width="25" height="120" rx="12.5" fill="#B97A57"/>
    <rect class="f f3" x="690" y="548" width="25" height="116" rx="12.5" fill="#B97A57"/>
    <rect class="f f4" x="717" y="572" width="23" height="98" rx="11.5" fill="#B97A57"/>
    <rect class="f thumb" x="596" y="666" width="26" height="76" rx="13" fill="#B97A57" transform="rotate(-38 609 704)"/>
  </g></g>
</svg>
