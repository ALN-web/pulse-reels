<style>
  #scene-s3 .chart { position: absolute; left: 20px; top: 260px; width: 830px; height: 520px; background: #fff; border-radius: 36px; box-shadow: 0 16px 40px rgba(18,52,59,.10); }
  #scene-s3 .chart svg { width: 100%; height: 100%; }
  #scene-s3 .key { position: absolute; left: 20px; top: 60px; display: flex; gap: 24px; }
  #scene-s3 .k { padding: 14px 30px; border-radius: 999px; font: 800 42px var(--font-body); color: var(--ink); }
  #scene-s3 .kflu { background: var(--soft); }
  #scene-s3 .kcold { background: var(--accent); }
</style>
<div class="key"><div class="k kflu">Flu: fast</div><div class="k kcold">Cold: slow</div></div>
<div class="chart">
  <svg viewBox="0 0 830 520">
    <path d="M90 440 H780 M90 440 V60" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="440" y="495" text-anchor="middle" fill="var(--ink)" style="font: 800 34px Inter, sans-serif;">Time</text>
    <path d="M100 430 C180 425 200 120 290 90 L760 80" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
    <text x="320" y="70" fill="var(--primary)" style="font: 800 40px Inter, sans-serif;">Flu</text>
    <path class="cold" d="M100 430 C330 420 560 330 760 200" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <text class="cold-lbl" x="640" y="300" fill="var(--ink)" style="font: 800 40px Inter, sans-serif;">Cold</text>
  </svg>
</div>
<script>
  tl.from(q(".kcold"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.out" }, w("cold"));
  tl.to(q(".cold"), { strokeDashoffset: 0, duration: 1.4, ease: "power1.inOut" }, w("creeps"));
  tl.from(q(".cold-lbl"), { opacity: 0, duration: 0.3 }, w("gradually"));
</script>
