<style>
  #scene-s5 .header { position: absolute; left: 20px; top: 60px; font: 800 52px var(--font-display); color: var(--ink); }
  #scene-s5 .cards { position: absolute; left: 0; top: 200px; width: 870px; display: flex; justify-content: space-between; padding: 0 20px; gap: 20px; box-sizing: border-box; }
  #scene-s5 .card { flex: 1; background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.10); padding: 36px 14px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #scene-s5 .card svg { width: 120px; height: 120px; }
  #scene-s5 .card .lbl { font: 700 34px var(--font-body); color: var(--ink); text-align: center; line-height: 1.2; }
</style>
<div class="header">Flu goes further:</div>
<div class="cards">
  <div class="card aches">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="16" r="11" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <path d="M50 28 V62 M50 38 L28 54 M50 38 L72 54 M50 62 L36 92 M50 62 L64 92" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="28" cy="54" r="7" fill="var(--accent)"/>
      <circle cx="72" cy="54" r="7" fill="var(--accent)"/>
      <circle cx="50" cy="48" r="7" fill="var(--accent)"/>
      <circle cx="40" cy="80" r="7" fill="var(--accent)"/>
    </svg>
    <span class="lbl">Body<br>aches</span>
  </div>
  <div class="card temp">
    <svg viewBox="0 0 100 100">
      <rect x="40" y="10" width="20" height="60" rx="10" fill="var(--soft)" stroke="var(--ink)" stroke-width="4"/>
      <rect x="40" y="26" width="20" height="44" rx="8" fill="var(--accent)"/>
      <circle cx="50" cy="80" r="14" fill="var(--accent)" stroke="var(--ink)" stroke-width="4"/>
      <path d="M68 24 L76 24 M68 36 L74 36 M68 48 L76 48" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="lbl">High<br>temperature</span>
  </div>
  <div class="card tired">
    <svg viewBox="0 0 100 100">
      <rect x="14" y="30" width="64" height="40" rx="8" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <rect x="78" y="42" width="8" height="16" rx="2" fill="var(--ink)"/>
      <rect x="22" y="38" width="12" height="24" rx="3" fill="var(--accent)"/>
    </svg>
    <span class="lbl">Feeling<br>exhausted</span>
  </div>
</div>
<script>
  tl.from(q(".header"), { opacity: 0, duration: 0.3 }, w("Flu"));
  tl.from(q(".aches"), { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("aches"));
  tl.from(q(".temp"),  { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("temperature"));
  tl.from(q(".tired"), { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("exhaustion"));
</script>
