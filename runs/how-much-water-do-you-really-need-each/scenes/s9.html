<style>
  #scene-s9 .card { position: absolute; left: 135px; top: 60px; width: 600px; height: 640px; background: #fff; border-radius: 40px; box-shadow: 0 16px 40px rgba(18,52,59,.10); }
  #scene-s9 .bottle { position: absolute; left: 200px; top: 60px; width: 200px; height: 520px; }
  #scene-s9 .tag { position: absolute; right: 30px; top: 60px; padding: 14px 26px; border-radius: 999px; background: var(--accent); font: 800 34px var(--font-body); color: var(--ink); }
</style>
<div class="card">
  <svg class="bottle" viewBox="0 0 200 520">
    <rect x="70" y="10" width="60" height="50" rx="12" fill="var(--ink)"/>
    <path d="M150 30 C185 30 185 90 150 90" fill="none" stroke="var(--ink)" stroke-width="10"/>
    <path d="M55 60 H145 C170 80 175 110 175 140 V480 C175 500 160 512 140 512 H60 C40 512 25 500 25 480 V140 C25 110 30 80 55 60 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M30 220 H170 V480 C170 498 158 506 140 506 H60 C42 506 30 498 30 480 Z" fill="var(--primary)"/>
    <path d="M60 280 C80 270 100 290 120 280" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  </svg>
  <div class="tag">Daily habit</div>
</div>
<script>
  tl.from(q(".card"), { y: 40, opacity: 0, duration: 0.35, ease: "power2.out" }, w("habit"));
  tl.from(q(".bottle"), { y: 80, rotation: -6, opacity: 0, duration: 0.45, ease: "back.out(1.6)" }, w("carry"));
  tl.to(q(".bottle"), { rotation: 6, duration: 0.3, ease: "power1.inOut", yoyo: true, repeat: 1 }, w("water"));
  tl.from(q(".tag"), { rotation: -20, opacity: 0, transformOrigin: "100% 0%", duration: 0.35, ease: "back.out(2)" }, w("bottle"));
</script>
