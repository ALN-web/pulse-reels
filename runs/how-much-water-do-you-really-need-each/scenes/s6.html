<style>
  #scene-s6 .grid { position: absolute; left: 15px; top: 60px; width: 840px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  #scene-s6 .card { background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.10); height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 16px; }
  #scene-s6 .card svg { width: 140px; height: 140px; }
  #scene-s6 .lbl { font: 700 38px var(--font-body); color: var(--ink); text-align: center; line-height: 1.15; }
</style>
<div class="grid">
  <div class="card sun">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="var(--accent)"/><g stroke="var(--accent)" stroke-width="6" stroke-linecap="round"><path d="M50 8 V20 M50 80 V92 M8 50 H20 M80 50 H92 M20 20 L28 28 M72 72 L80 80 M80 20 L72 28 M28 72 L20 80"/></g></svg>
    <span class="lbl">Hot weather</span>
  </div>
  <div class="card run">
    <svg viewBox="0 0 100 100"><path d="M14 66 C14 56 22 52 30 52 L46 50 L56 34 L66 38 L62 54 C76 56 88 60 88 70 V76 H14 Z" fill="var(--primary)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M14 76 H88" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/></svg>
    <span class="lbl">Exercise</span>
  </div>
  <div class="card fever">
    <svg viewBox="0 0 100 100"><rect x="40" y="10" width="20" height="60" rx="10" fill="var(--soft)" stroke="var(--ink)" stroke-width="4"/><rect x="40" y="30" width="20" height="40" rx="8" fill="var(--alert)"/><circle cx="50" cy="80" r="14" fill="var(--alert)"/></svg>
    <span class="lbl">Fever</span>
  </div>
  <div class="card sick">
    <svg viewBox="0 0 100 100"><path d="M40 14 C40 30 22 30 22 52 C22 74 38 88 56 88 C74 88 80 74 76 62 C72 50 58 52 58 40 V14" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M40 56 C46 62 54 62 60 56" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="lbl">Vomiting or diarrhea</span>
  </div>
</div>
<script>
  tl.from(q(".sun"),   { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("weather"));
  tl.from(q(".run"),   { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("exercise"));
  tl.from(q(".fever"), { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("fever"));
  tl.from(q(".sick"),  { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("vomiting"));
</script>
