<style>
  #scene-s7 .card { position: absolute; left: 15px; top: 140px; width: 840px; height: 460px; background: #fff; border-radius: 36px; box-shadow: 0 16px 40px rgba(18,52,59,.10); }
  #scene-s7 .strip { position: absolute; left: 50px; top: 120px; width: 740px; display: flex; gap: 20px; }
  #scene-s7 .sw { flex: 1; height: 200px; border-radius: 28px; background: var(--accent); }
  #scene-s7 .ring { position: absolute; left: 30px; top: 100px; width: 205px; height: 240px; border-radius: 40px; border: 10px solid var(--primary); }
  #scene-s7 .tick { position: absolute; left: 100px; top: 40px; width: 70px; height: 70px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  #scene-s7 .tick svg { width: 42px; height: 42px; }
  #scene-s7 .ends { position: absolute; left: 50px; top: 360px; width: 740px; display: flex; justify-content: space-between; font: 700 34px var(--font-body); color: var(--ink); }
</style>
<div class="card">
  <div class="strip">
    <div class="sw" style="background:#FBF3C4"></div>
    <div class="sw" style="background:#F5E27A"></div>
    <div class="sw" style="background:#E3BC3A"></div>
    <div class="sw" style="background:#B8861B"></div>
  </div>
  <div class="ring"></div>
  <div class="tick"><svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ends"><span>Pale</span><span>Dark</span></div>
</div>
<script>
  tl.from(q(".card"), { opacity: 0, y: 30, duration: 0.3, ease: "power2.out" }, t);
  tl.from(qa(".sw"), { scaleY: 0, transformOrigin: "50% 100%", duration: 0.3, stagger: 0.08, ease: "power2.out" }, w("check"));
  tl.from(q(".ends"), { opacity: 0, duration: 0.3 }, w("check"));
  tl.from([q(".ring"), q(".tick")], { scale: 0.6, opacity: 0, duration: 0.35, ease: "back.out(2)" }, w("pale"));
</script>
