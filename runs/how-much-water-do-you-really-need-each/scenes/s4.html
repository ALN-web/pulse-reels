<style>
  #scene-s4 .grid { position: absolute; left: 15px; top: 60px; width: 840px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  #scene-s4 .card { position: relative; background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.10); height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  #scene-s4 .card svg.ic { width: 140px; height: 140px; }
  #scene-s4 .lbl { font: 700 38px var(--font-body); color: var(--ink); text-align: center; }
  #scene-s4 .chk { position: absolute; right: 20px; top: 20px; width: 64px; height: 64px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; }
  #scene-s4 .chk svg { width: 38px; height: 38px; }
</style>
<div class="grid">
  <div class="card milk">
    <svg class="ic" viewBox="0 0 100 100"><path d="M32 30 L40 14 H60 L68 30 V88 H32 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M32 30 H68" stroke="var(--ink)" stroke-width="5"/><rect x="40" y="48" width="20" height="22" rx="4" fill="var(--primary)"/></svg>
    <span class="lbl">Lower-fat milk</span>
    <span class="chk"><svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="card drink">
    <svg class="ic" viewBox="0 0 100 100"><rect x="30" y="16" width="40" height="72" rx="10" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/><path d="M30 34 H70 M30 70 H70" stroke="var(--ink)" stroke-width="4"/><circle cx="50" cy="52" r="8" fill="var(--accent)"/></svg>
    <span class="lbl">Lower-sugar drinks</span>
    <span class="chk"><svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="card tea">
    <svg class="ic" viewBox="0 0 100 100"><path d="M18 40 H72 V62 C72 76 62 84 45 84 C28 84 18 76 18 62 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M72 46 C86 46 86 66 72 66" fill="none" stroke="var(--ink)" stroke-width="5"/><path d="M46 40 V22" stroke="var(--ink)" stroke-width="3"/><rect x="39" y="12" width="14" height="12" rx="2" fill="var(--accent)"/></svg>
    <span class="lbl">Tea</span>
    <span class="chk"><svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="card coffee">
    <svg class="ic" viewBox="0 0 100 100"><path d="M22 34 H68 V78 C68 84 64 88 58 88 H32 C26 88 22 84 22 78 Z" fill="var(--ink)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/><path d="M68 44 C84 44 84 68 68 68" fill="none" stroke="var(--ink)" stroke-width="5"/><path d="M36 26 C32 20 40 16 36 10 M52 26 C48 20 56 16 52 10" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/></svg>
    <span class="lbl">Coffee</span>
    <span class="chk"><svg viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
</div>
<script>
  tl.from(q(".milk"),   { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("milk"));
  tl.from(q(".drink"),  { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("drinks"));
  tl.from(q(".tea"),    { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("tea"));
  tl.from(q(".coffee"), { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("coffee"));
  tl.from(qa(".chk"), { scale: 0, opacity: 0, duration: 0.25, stagger: 0.06, ease: "back.out(2)" }, w("count"));
</script>
