<style>
  #scene-s5 .chip { position: absolute; padding: 16px 30px; border-radius: 999px; background: #fff; box-shadow: 0 12px 30px rgba(18,52,59,.12); font: 800 40px var(--font-body); color: var(--primary); border: 4px solid var(--primary); }
  #scene-s5 .c1 { left: 10px; top: 60px; }
  #scene-s5 .c2 { left: 10px; top: 200px; }
  #scene-s5 .c3 { right: 10px; top: 60px; }
  #scene-s5 .guide { position: absolute; right: 10px; top: 200px; padding: 16px 28px; border-radius: 24px; background: var(--accent); font: 800 36px var(--font-body); color: var(--ink); }
</style>
<div class="chip c1">Age</div>
<div class="chip c2">Sex</div>
<div class="chip c3">Activity</div>
<div class="guide">A guide, not a rule</div>
<script>
  tl.from(q(".c1"), { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("age"));
  tl.from(q(".c2"), { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("sex"));
  tl.from(q(".c3"), { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("activity"));
  tl.from(q(".guide"), { opacity: 0, y: 20, duration: 0.3, ease: "power2.out" }, w("guide"));
  ira.hand(w("vary"), "five");
  ira.handDown(w("activity") + 0.4);
</script>
