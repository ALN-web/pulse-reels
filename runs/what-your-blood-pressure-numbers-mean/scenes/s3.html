<style>
  #scene-s3 .mon { position: absolute; left: 75px; top: 60px; width: 720px; height: 640px; }
  #scene-s3 .num { position: absolute; left: 0; width: 720px; text-align: center; font-size: 230px; line-height: 1; }
  #scene-s3 .n1 { top: 70px; opacity: 0.2; } #scene-s3 .n2 { top: 360px; }
  #scene-s3 .bar { position: absolute; left: 160px; width: 400px; top: 316px; height: 8px; border-radius: 4px; background: var(--line); }
  #scene-s3 .tag { position: absolute; left: 50%; transform: translateX(-50%); bottom: -32px; padding: 10px 22px; border-radius: 999px; background: var(--glow); color: var(--screen); font: 800 34px var(--font-body); letter-spacing: 0.06em; }
  #scene-s3 .ecg { position: absolute; left: 0; top: 740px; width: 870px; height: 200px; }
</style>
<div class="mon panel">
  <div class="num n1 lcd">120</div>
  <div class="bar"></div>
  <div class="num n2 lcd">80</div>
  <div class="tag">DIASTOLIC</div>
</div>
<svg class="ecg" viewBox="0 20 870 170">
  <path class="trace" d="M 0 110 H 150 L 175 110 L 195 30 L 220 180 L 240 110 H 560 L 585 110 L 605 30 L 630 180 L 650 110 H 870"
        fill="none" stroke="#5FD4C4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400"/>
</svg>
<script>
  tl.fromTo(q(".n2"), { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out" }, w("bottom"));
  tl.from(q(".tag"), { y: 30, opacity: 0, duration: 0.3, ease: "power2.out" }, w("number"));
  // beat ... long flat rest ... beat
  tl.to(q(".trace"), { strokeDashoffset: 1400 - 330, duration: 0.5, ease: "none" }, t + 0.2);
  tl.to(q(".trace"), { strokeDashoffset: 1400 - 740, duration: Math.max(0.3, w("beats") - w("rests")), ease: "none" }, w("rests"));
  tl.to(q(".trace"), { strokeDashoffset: 0, duration: 0.6, ease: "none" }, w("beats"));
</script>
