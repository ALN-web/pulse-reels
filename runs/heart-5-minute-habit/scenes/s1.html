<style>
  #scene-s1 .clock { position: absolute; left: 10px; top: 150px; width: 250px; height: 250px; }
  #scene-s1 .clock .face { position: absolute; inset: 0; border-radius: 50%; background: #fff; border: 14px solid var(--primary); box-shadow: 0 18px 40px rgba(18,52,59,.16); }
  #scene-s1 .clock .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 74px var(--font-body); color: var(--ink); }
  #scene-s1 .heart { position: absolute; left: 640px; top: 190px; width: 190px; height: 190px; }
</style>
<div class="clock"><div class="face"></div><div class="num">5:00</div></div>
<svg class="heart" viewBox="0 0 100 100"><path d="M50 86 C20 64 6 48 6 30 C6 16 17 6 30 6 C39 6 46 11 50 18 C54 11 61 6 70 6 C83 6 94 16 94 30 C94 48 80 64 50 86 Z" fill="#E8914A"/></svg>
<script>
  tl.from(q(".clock"), { scale: 0.6, opacity: 0, duration: 0.4, ease: "back.out(1.8)" }, w("five"));
  ira.hand(w("five") - 0.05, "five");
  tl.from(q(".heart"), { scale: 0, opacity: 0, duration: 0.35, ease: "back.out(2)" }, t + 0.15);
  tl.to(q(".heart"), { scale: 1.18, duration: 0.16, yoyo: true, repeat: 1, ease: "power1.inOut" }, w("today"));
  ira.handDown(w("today") + 0.3);
</script>
