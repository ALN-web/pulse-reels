<script>
  tl.from(qa(".organ"), { y: 50, opacity: 0, duration: 0.35, stagger: 0.12, ease: "power2.out" }, t + 0.1);
  tl.from(q(".riskbar"), { scaleX: 0.3, opacity: 0, duration: 0.35, ease: "power3.out" }, w("lower") - 0.1);
  tl.from(q(".riskbar .arrow"), { y: -50, opacity: 0, duration: 0.4, ease: "bounce.out" }, w("lower"));

</script>
