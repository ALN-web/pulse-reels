<div class="num big-num">25 ml</div>

<script>
  tl.from(q(".shot"), { x: -400, opacity: 0, duration: 0.4, ease: "power3.out" }, t);
  tl.from(q(".liq"), { scaleY: 0, transformOrigin: "50% 100%", duration: 0.45, ease: "power2.out" }, w("single"));
