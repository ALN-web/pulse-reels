<style>
  #scene-s1 .slab { position: absolute; left: 85px; top: 40px; width: 700px; height: 640px; }
  #scene-s1 .glass { position: absolute; left: 200px; top: 70px; width: 300px; height: 480px; }
  #scene-s1 .ask { position: absolute; left: 0; top: 730px; width: 870px; text-align: center; }
  #scene-s1 .ask .chip { font-size: 52px; padding: 16px 40px; }
  #scene-s1 .cross { position: absolute; left: 255px; top: 690px; width: 360px; height: 170px; }
</style>
<div class="block apricot slab">
  <svg class="glass" viewBox="0 0 300 480">
    <path d="M40 20 H260 Q262 200 150 250 Q38 200 40 20 Z" fill="#fff"/>
    <path class="wine" d="M52 110 H248 Q238 210 150 240 Q62 210 52 110 Z" fill="#C8553D"/>
    <rect x="140" y="248" width="20" height="170" rx="10" fill="#fff"/>
    <rect x="70" y="410" width="160" height="26" rx="13" fill="#fff"/>
  </svg>
</div>
<div class="ask"><span class="chip">= 1 unit?</span></div>
<svg class="cross" viewBox="0 0 360 170">
  <path class="x1" d="M40 20 L320 150" stroke="#C8553D" stroke-width="22" stroke-linecap="round"/>
  <path class="x2" d="M320 20 L40 150" stroke="#C8553D" stroke-width="22" stroke-linecap="round"/>
</svg>
<script>
  tl.from(q(".slab"), { yPercent: 40, opacity: 0, duration: 0.35, ease: "power3.out" }, t);
  tl.from(q(".glass"), { y: -260, opacity: 0, duration: 0.45, ease: "bounce.out" }, w("glass"));
  tl.from(q(".wine"), { scaleY: 0, transformOrigin: "50% 100%", duration: 0.35, ease: "power2.out" }, w("wine"));
  tl.from(q(".ask .chip"), { scale: 0.5, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("unit"));
  tl.from(q(".x1"), { scaleX: 0, transformOrigin: "0% 0%", duration: 0.18, ease: "power2.out" }, w("not"));
  tl.from(q(".x2"), { scaleX: 0, transformOrigin: "100% 0%", duration: 0.18, ease: "power2.out" }, w("not") + 0.15);
</script>
