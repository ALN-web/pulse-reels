<style>
  #scene-s10 .bottle { position: absolute; left: 255px; top: 20px; width: 360px; height: 780px; }
  #scene-s10 .lab { position: absolute; left: 285px; top: 400px; width: 300px; height: 230px; border-radius: 26px; background: var(--paper); }
  #scene-s10 .lab .k { position: absolute; left: 0; top: 26px; width: 300px; text-align: center; font: 800 44px var(--font-body); color: var(--p-ink); }
  #scene-s10 .lab .bar { position: absolute; left: 30px; top: 100px; width: 240px; height: 100px; border-radius: 20px; color: #fff; font: 800 56px var(--font-body);
    display: flex; align-items: center; justify-content: center; }
  #scene-s10 .mag { position: absolute; left: 20px; top: 380px; width: 240px; height: 240px; }
  #scene-s10 .tick { position: absolute; left: 650px; top: 260px; width: 160px; height: 160px; }
</style>
<svg class="bottle" viewBox="0 0 360 780">
  <rect x="140" y="0" width="80" height="60" rx="14" fill="#12343B"/>
  <path d="M148 56 H212 V170 Q330 230 330 330 V740 Q330 770 300 770 H60 Q30 770 30 740 V330 Q30 230 148 170 Z" fill="#0F7C7E"/>
</svg>
<div class="lab"><div class="k">Strength</div><div class="bar block ink">ABV %</div></div>
<svg class="mag" viewBox="0 0 100 100"><circle cx="42" cy="42" r="30" fill="#FBF3E6" fill-opacity="0.35" stroke="#12343B" stroke-width="9"/><path d="M64 64 L90 90" stroke="#12343B" stroke-width="12" stroke-linecap="round"/></svg>
<svg class="tick" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#E8914A"/><path d="M28 52 L44 68 L74 36" fill="none" stroke="#12343B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
<script>
  tl.from([q(".bottle"), q(".lab")], { y: 160, opacity: 0, duration: 0.4, ease: "power3.out" }, t);
  tl.from(q(".mag"), { opacity: 0, duration: 0.2 }, w("check"));
  tl.to(q(".mag"), { x: 230, duration: 0.6, ease: "power2.inOut" }, w("strength"));
  tl.to(q(".lab .bar"), { scale: 1.1, duration: 0.25, ease: "back.out(2)" }, w("label"));
  tl.to(q(".mag"), { opacity: 0, duration: 0.2 }, w("before"));
  tl.from(q(".tick"), { scale: 0, opacity: 0, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2.5)" }, w("pour"));
</script>
