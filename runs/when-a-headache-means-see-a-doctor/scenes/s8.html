<style>
  #scene-s8 .card { position: absolute; top: 40px; width: 250px; background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.12); padding: 24px 10px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

  #scene-s8 .card .lbl { font: 700 34px var(--font-body); color: var(--ink); text-align: center; line-height: 1.15; }
  #scene-s8 .bump { left: 20px; }
  #scene-s8 .doc { right: 20px; }
</style>
<div class="card bump">

</div>
<script>
  tl.from(q(".bump"), { opacity: 0, y: 20, duration: 0.3, ease: "power2.out" }, w("head"));
  tl.from(q(".doc"),  { opacity: 0, x: 60, duration: 0.3, ease: "power2.out" }, w("doctor"));
</script>
