<style>
  #scene-s6 .icons { position: absolute; left: 20px; top: 110px; width: 830px; display: flex; justify-content: space-between; }
  #scene-s6 .ic { width: 240px; background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.12); padding: 24px 10px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #scene-s6 .ic svg { width: 110px; height: 110px; }
  #scene-s6 .ic .lbl { font: 700 34px var(--font-body); color: var(--ink); text-align: center; line-height: 1.15; }
</style>
<div class="icons">
  <div class="ic eye">
    <svg viewBox="0 0 100 100">
      <path d="M8 50 Q50 12 92 50 Q50 88 8 50 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="50" cy="50" r="15" fill="var(--primary)"/>
      <circle cx="50" cy="50" r="6" fill="var(--ink)"/>
    </svg>
    <span class="lbl">Vision<br>changes</span>
  </div>
  <div class="ic body">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="18" r="12" fill="none" stroke="var(--ink)" stroke-width="5"/>
      <path d="M50 30 L50 66 M50 40 L28 56 M50 40 L72 56 M50 66 L36 92 M50 66 L64 92" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      <rect x="50" y="4" width="44" height="92" rx="6" fill="var(--alert)" opacity="0.28"/>
    </svg>
    <span class="lbl">One-sided<br>weakness</span>
  </div>
  <div class="ic speech">
    <svg viewBox="0 0 100 100">
      <path d="M12 18 H88 V66 H44 L26 84 L28 66 H12 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M28 42 Q36 32 44 42 T60 42 T76 42" fill="none" stroke="var(--alert)" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <span class="lbl">Trouble<br>speaking</span>
  </div>
</div>
<script>
  tl.from(q(".eye"),    { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("vision"));
  tl.from(q(".body"),   { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("weakness"));
  tl.from(q(".speech"), { scale: 0, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("speaking"));
</script>
