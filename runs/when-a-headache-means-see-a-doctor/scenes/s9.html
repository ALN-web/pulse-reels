<script>
  tl.from(q(".chart"), { opacity: 0, y: 30, duration: 0.3, ease: "power2.out" }, t);
  tl.from(q(".axes"), { opacity: 0, duration: 0.3 }, w("steadily"));
  tl.to(q(".cover"), { scaleX: 0, transformOrigin: "100% 50%", duration: Math.max(1, d - 1.2), ease: "power1.inOut" }, w("gets"));
