<style>
  #scene-s5 .note { position: absolute; left: 95px; top: 90px; width: 680px; height: 600px; background: #fff; border-radius: 28px; box-shadow: 0 20px 50px rgba(18,52,59,.14); border-top: 26px solid var(--primary); }
  #scene-s5 .row { position: absolute; left: 50px; display: flex; align-items: center; gap: 30px; }
  #scene-s5 .r1 { top: 130px; }
  #scene-s5 .r2 { top: 330px; }
  #scene-s5 .box { width: 76px; height: 76px; flex-shrink: 0; }
  #scene-s5 .txt { font: 700 54px var(--font-display); color: var(--ink); }
</style>
<div class="note">
  <div class="row r1">
    <svg class="box" viewBox="0 0 80 80"><rect x="4" y="4" width="72" height="72" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="6"/><path class="t1" d="M20 42 L35 56 L62 24" fill="none" stroke="var(--primary)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="txt q1">Which condition?</span>
  </div>
  <div class="row r2">
    <svg class="box" viewBox="0 0 80 80"><rect x="4" y="4" width="72" height="72" rx="14" fill="var(--soft)" stroke="var(--primary)" stroke-width="6"/><path class="t2" d="M20 42 L35 56 L62 24" fill="none" stroke="var(--primary)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="txt q2">Age it started?</span>
  </div>
</div>
<script>
  tl.from(q(".note"), { y: 80, opacity: 0, duration: 0.4, ease: "power2.out" }, w("which"));
  tl.from(q(".q1"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.out" }, w("conditions"));
  tl.from(q(".q2"), { opacity: 0, x: -30, duration: 0.3, ease: "power2.out" }, w("old"));
  tl.from(q(".t1"), { opacity: 0, scale: 0.3, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 50%", transformBox: "fill-box" }, w("had"));
  tl.from(q(".t2"), { opacity: 0, scale: 0.3, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 50%", transformBox: "fill-box" }, w("started"));
</script>
