<style>
  #scene-s6 .badge { position: absolute; left: 155px; top: 60px; width: 560px; height: 360px; border-radius: 48px; background: var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(18,52,59,.2); }
  #scene-s6 .badge .small { font: 700 48px var(--font-body); color: #fff; }
  #scene-s6 .badge .big { font: 800 170px var(--font-display); color: #fff; line-height: 1; }
  #scene-s6 .who { position: absolute; left: 0; top: 480px; width: 870px; display: flex; justify-content: center; gap: 40px; }
  #scene-s6 .who .p { background: #fff; border-radius: 28px; box-shadow: 0 12px 30px rgba(18,52,59,.12); padding: 20px 30px; display: flex; align-items: center; gap: 18px; font: 700 40px var(--font-body); color: var(--ink); }
  #scene-s6 .who svg { width: 64px; height: 64px; }
  #scene-s6 .cc { position: absolute; left: 0; top: 650px; width: 870px; text-align: center; font: 700 42px var(--font-body); color: var(--ink); }
</style>
<div class="badge"><span class="small">before age</span><span class="big num">50</span></div>
<div class="who">
  <div class="p"><svg viewBox="0 0 60 60"><circle cx="30" cy="18" r="12" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/><path d="M8 56 C8 38 52 38 52 56" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/></svg>Parent</div>
  <div class="p"><svg viewBox="0 0 60 60"><circle cx="30" cy="20" r="10" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/><path d="M12 56 C12 40 48 40 48 56" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/></svg>Sibling</div>
</div>
<div class="cc">with colorectal cancer</div>
<script>
  tl.from(q(".badge"), { scale: 0.5, opacity: 0, duration: 0.35, ease: "back.out(2)" }, w("age"));
  tl.from(qa(".who .p"), { x: -60, opacity: 0, duration: 0.3, stagger: 0.25, ease: "power2.out" }, w("parent"));
  tl.from(q(".cc"), { opacity: 0, y: 20, duration: 0.3, ease: "power2.out" }, w("colorectal"));
  tl.to(q(".num"), { scale: 1.18, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, w("50"));
</script>
