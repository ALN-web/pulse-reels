<style>
  #scene-s3 .cards { position: absolute; left: 15px; top: 70px; width: 840px; display: flex; justify-content: space-between; }
  #scene-s3 .card { width: 260px; background: #fff; border-radius: 30px; box-shadow: 0 16px 40px rgba(18,52,59,.12); padding: 18px 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #scene-s3 .card svg { width: 96px; height: 96px; }
  #scene-s3 .card .lbl { font: 700 34px var(--font-body); color: var(--ink); text-align: center; line-height: 1.1; }
</style>
<div class="cards">
  <div class="card c1">
    <svg viewBox="0 0 100 100"><path d="M50 40 C30 10 70 10 50 40 L30 88 M50 40 L70 88" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="lbl">Cancer</span>
  </div>
  <div class="card c2">
    <svg viewBox="0 0 100 100"><path d="M50 86 L16 50 C4 36 14 14 32 14 C42 14 48 22 50 28 C52 22 58 14 68 14 C86 14 96 36 84 50 Z" fill="var(--alert)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></svg>
    <span class="lbl">Heart disease</span>
  </div>
  <div class="card c3">
    <svg viewBox="0 0 100 100"><path d="M50 10 C50 10 20 46 20 64 C20 80 34 92 50 92 C66 92 80 80 80 64 C80 46 50 10 50 10 Z" fill="var(--primary)" stroke="var(--ink)" stroke-width="4"/></svg>
    <span class="lbl">Diabetes</span>
  </div>
</div>
<script>
  tl.from(q(".c1"), { y: -40, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("cancer"));
  tl.from(q(".c2"), { y: -40, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("heart"));
  tl.from(q(".c3"), { y: -40, opacity: 0, duration: 0.3, ease: "back.out(2)" }, w("diabetes"));
</script>
