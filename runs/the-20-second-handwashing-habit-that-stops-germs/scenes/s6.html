<style>

<script>
  tl.from(q(".card"), { y: 80, opacity: 0, duration: 0.35, ease: "power2.out" }, w("four"));

  tl.fromTo(qa(".bub"), { y: 0, opacity: 1 }, { y: 60, opacity: 0, duration: 1.0, ease: "power1.in", stagger: 0.2 }, w("rinse") + 0.4);
