<style>

<script>
  tl.from(q(".card"), { y: 80, opacity: 0, duration: 0.35, ease: "power2.out" }, w("one"));
  const reps = Math.max(0, Math.floor((t + d - w("wet")) / 0.6) - 2);
  qa(".drop").forEach((el, i) => {
    tl.fromTo(el, { y: 0, opacity: 1 }, { y: 120, opacity: 0, duration: 0.6, ease: "power1.in", repeat: reps }, w("wet") + i * 0.2);
  });
  tl.from(q(".soap"), { x: 120, opacity: 0, duration: 0.35, ease: "power2.out" }, w("soap"));
</script>
