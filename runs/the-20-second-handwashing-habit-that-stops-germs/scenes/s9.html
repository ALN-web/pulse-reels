<style>
  #scene-s9 .cards { position: absolute; left: 0; top: 200px; width: 870px; display: flex; justify-content: space-between; padding: 0 20px; gap: 20px; box-sizing: border-box; }
  #scene-s9 .card { flex: 1; background: #fff; border-radius: 32px; box-shadow: 0 16px 40px rgba(18,52,59,.10); padding: 36px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #scene-s9 .card svg { width: 120px; height: 120px; }
  #scene-s9 .card .lbl { font: 700 34px var(--font-body); color: var(--ink); text-align: center; line-height: 1.2; }
  #scene-s9 .header { position: absolute; left: 20px; top: 70px; font: 800 46px var(--font-body); color: var(--ink); }
</style>
<div class="header">Wash your hands:</div>
<div class="cards">
  <div class="card eat">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="54" r="30" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/>
      <circle cx="50" cy="54" r="16" fill="none" stroke="var(--primary)" stroke-width="4"/>
      <path d="M10 22 V48 M6 22 V34 Q10 40 14 34 V22" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <span class="lbl">Before<br>eating</span>
  </div>
  <div class="card toilet">
    <svg viewBox="0 0 100 100">
      <rect x="22" y="10" width="40" height="30" rx="6" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/>
      <path d="M18 44 H82 Q82 70 56 74 L60 92 H34 L38 74 Q18 70 18 44 Z" fill="var(--soft)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <span class="lbl">After the<br>toilet</span>
  </div>
  <div class="card nose">
    <svg viewBox="0 0 100 100">
      <rect x="14" y="44" width="72" height="44" rx="8" fill="var(--soft)" stroke="var(--ink)" stroke-width="5"/>
      <path d="M38 44 Q40 20 50 14 Q60 22 62 44" fill="#fff" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <span class="lbl">After cough,<br>sneeze, nose</span>
  </div>
</div>
<script>
  tl.from(q(".header"), { opacity: 0, duration: 0.3 }, w("Wash"));
  tl.from(q(".eat"),    { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("eat"));
  tl.from(q(".toilet"), { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("toilet"));
  tl.from(q(".nose"),   { y: 60, opacity: 0, duration: 0.35, ease: "power2.out" }, w("cough"));
</script>
