<style>

<script>
  tl.from(q(".k1"), { opacity: 0, y: 40, duration: 0.3, ease: "power2.out" }, w("brain"));
  tl.from(q(".k2"), { opacity: 0, y: 40, duration: 0.3, ease: "power2.out" }, w("body"));

  tl.to(qa(".low"), { opacity: 1, scaleX: 0.35, transformOrigin: "0% 50%", duration: 0.6, ease: "power2.inOut" }, w("less"));
