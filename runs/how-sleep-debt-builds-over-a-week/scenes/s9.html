<style>
  #scene-s9 .clock { position: absolute; left: 215px; top: 60px; width: 440px; height: 440px; }
  #scene-s9 .hand { position: absolute; left: 429px; top: 120px; width: 12px; height: 160px; border-radius: 6px; background: var(--mid); }
  #scene-s9 .moon { position: absolute; left: 400px; top: 120px; width: 70px; height: 70px; }
  #scene-s9 .bed { position: absolute; left: 235px; top: 560px; width: 400px; height: 200px; }
</style>
<svg class="clock" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="46" fill="var(--screen-2)" stroke="var(--line)" stroke-width="3"/>
  <g stroke="var(--muted)" stroke-width="3" stroke-linecap="round"><path d="M50 8 L50 15 M50 85 L50 92 M8 50 L15 50 M85 50 L92 50"/></g>
  <circle cx="50" cy="50" r="3.5" fill="var(--text)"/>
</svg>
<div class="hand"></div>
<svg class="bed" viewBox="0 0 200 100">
  <path class="frame" d="M10 20 L10 90 M10 70 L190 70 L190 90 M10 50 L190 50 L190 70" fill="none" stroke="var(--glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="22" y="32" width="44" height="18" rx="8" fill="var(--glow)"/>
  <rect x="74" y="34" width="116" height="16" rx="6" fill="var(--glow)" opacity="0.6"/>
</svg>
<script>
  tl.from([q(".clock"), q(".hand")], { opacity: 0, scale: 0.9, transformOrigin: "50% 50%", duration: 0.35, ease: "power2.out" }, t);
  tl.set(q(".hand"), { rotation: 300, transformOrigin: "50% 100%" }, t);
  tl.from(q(".bed"), { opacity: 0, y: 40, duration: 0.35, ease: "power2.out" }, w("bed"));
  tl.to(q(".hand"), { rotation: 260, transformOrigin: "50% 100%", duration: 0.7, ease: "power2.inOut" }, w("earlier"));
  tl.fromTo(q(".bed"), { scale: 1 }, { scale: 1.05, transformOrigin: "50% 50%", duration: 0.2, yoyo: true, repeat: 1 }, w("earlier"));
</script>
